[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-filament-baseline"
version = "0.1.0"
description = "Morphology-conscious baseline for Solar Filament Segmentation 2026"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pycocotools>=2.0.7"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["solarfil*"]

